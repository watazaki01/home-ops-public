name: Codex作業承認
description: リスクのあるCodex作業へのowner承認を記録する
title: "Codex承認: "
labels:
  - approval-required
body:
  - type: textarea
    id: target
    attributes:
      label: 対象
      placeholder: "例: home-lab gateway package update"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      placeholder: "例: VPN daemon restartの可能性。remote accessへ一時影響の可能性。"
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: 実行予定コマンド概要
      placeholder: "例: package managerで対象packageのみ更新する"
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: 復旧/検証方法
      placeholder: "例: VPN status確認、通知test、local console fallback"
    validations:
      required: true
  - type: checkboxes
    id: approval
    attributes:
      label: 承認文
      options:
        - label: "ownerはコメントで「承認: <target> の <operation> を実行してよい」と書く"
          required: true
