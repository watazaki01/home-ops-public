name: 公開release安全チェック

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: secret/private情報らしき文字列を確認
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'sk-[A-Za-z0-9_-]{20,}'
            'tskey-'
            'discord\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+'
            'BEGIN .*PRIVATE'
            'OPENAI_API_KEY=.*[A-Za-z0-9]'
            'GH_APP_PRIVATE_KEY=.*BEGIN'
            '192\.168\.'
            '10\.0\.'
            '172\.16\.'
            '100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.'
            'fd7a:'
            '[a-z0-9-]+\.ts\.net'
          )
          status=0
          for pattern in "${patterns[@]}"; do
            if grep -RInE --exclude-dir=.git --exclude='release-criteria.md' --exclude='public-release-check.yml' "$pattern" .; then
              echo "::error::公開禁止情報らしき文字列を検出しました: $pattern"
              status=1
            fi
          done
          exit "$status"

      - name: 必須ファイルを確認
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f index.md
          test -f docs/release-criteria.md
          grep -q '公開禁止' README.md
          grep -q '公開release基準' docs/release-criteria.md
          test -f docs/resilient-status-refresh-pattern.md

      - name: Markdown相対リンクを確認
        shell: python
        run: |
          import pathlib
          import re
          import sys
          from urllib.parse import unquote

          root = pathlib.Path(".").resolve()
          missing = []
          link_re = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")

          for source in root.rglob("*.md"):
              if ".git" in source.parts:
                  continue
              text = source.read_text(encoding="utf-8")
              for raw_target in link_re.findall(text):
                  target = raw_target.strip().split(maxsplit=1)[0].strip("<>")
                  if not target or target.startswith(("#", "http://", "https://", "mailto:")):
                      continue
                  path_text = unquote(target.split("#", 1)[0])
                  destination = (source.parent / path_text).resolve()
                  try:
                      destination.relative_to(root)
                  except ValueError:
                      missing.append(f"{source}: link escapes repository: {target}")
                      continue
                  if not destination.exists():
                      missing.append(f"{source}: missing target: {target}")

          if missing:
              print("\n".join(missing))
              sys.exit(1)
